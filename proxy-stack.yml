# proxy-stack.yml
version: '3.8'
services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - /home/ubuntu/data:/data
      - /home/ubuntu/letsencrypt:/etc/letsencrypt
    deploy:
      placement:
        constraints: [node.role == manager]
