version: '3.8'

services:
  # Service cho ứng dụng Node.js của bạn
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Sử dụng tên service 'mongodb' làm hostname trong chuỗi kết nối
      - MONGO_URI=mongodb://mongodb:27017/products_db
    depends_on:
      - mongodb
    volumes:
      - ./public/uploads:/app/public/uploads

  # Service cho Database MongoDB
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: