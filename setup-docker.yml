---
- name: Cấu hình toàn bộ hạ tầng Swarm Cluster
  hosts: all
  become: yes
  tasks:
    - name: 1. Cài đặt các gói phụ thuộc (Dependencies)
      apt:
        update_cache: yes
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present

    - name: 2. Thêm Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: 3. Thêm Docker Repository chính thức
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: 4. Cài đặt Docker Engine (Bản Community Edition)
      apt:
        update_cache: yes
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: 5. Đảm bảo Docker đã khởi chạy
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: 6. Thêm user ubuntu vào group docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: 7. Tạo các thư mục lưu trữ dữ liệu (Persistence)
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0777'
      with_items:
        - /home/ubuntu/monitoring/prometheus_data
        - /home/ubuntu/monitoring/grafana_data
        - /home/ubuntu/app_uploads

- name: Khởi tạo Docker Swarm (Chỉ chạy trên Manager)
  hosts: manager
  become: yes
  tasks:
    - name: Init Swarm
      shell: docker swarm init --advertise-addr {{ ansible_host }}
      register: swarm_init
      ignore_errors: yes

    - name: Lấy mã Join Token cho Worker
      shell: docker swarm join-token -q worker
      register: worker_token

- name: Kết nối máy chủ Worker vào cụm Swarm
  hosts: worker
  become: yes
  tasks:
    - name: Thực hiện Join vào cụm
      shell: "docker swarm join --token {{ hostvars[groups['manager'][0]]['worker_token']['stdout'] }} {{ hostvars[groups['manager'][0]]['ansible_host'] }}:2377"
      ignore_errors: yes